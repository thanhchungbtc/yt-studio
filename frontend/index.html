<!doctype html>
<html lang="en" class="yts-vibrancy">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>yt-studio</title>
    <style>
      /* Transparent from the first paint, so the window's material shows. */
      html { background: transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Keeps #root from being body's last child: overlays portal in after it,
         and WebKit restyles the whole app whenever its :last-child state flips. -->
    <div hidden></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
