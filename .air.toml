# Hot reload for the server during `make dev`. Vite serves the web UI and
# proxies /api and /events here, so only Go sources trigger a rebuild.
root = "."
tmp_dir = "var/air"

[build]
  cmd = "go build -o ./var/air/yt-studio ./cmd/server"
  # entrypoint takes the binary and its arguments as separate list entries.
  # The deprecated `bin` string is handed to /bin/sh as a single path, which
  # fails the moment the command has arguments.
  #
  # --home var is what keeps development in the repository. The binary's own
  # default is ~/.yt-studio, which is where a packaged application belongs and
  # not where a checkout does: var/ already holds the database, the assets and
  # the gigabyte of resources this has always used. air runs from the repository
  # root, so the relative path resolves there.
  entrypoint = ["./var/air/yt-studio", "serve", "--home", "var"]
  include_ext = ["go", "sql"]
  exclude_dir = ["web", "var", ".git", ".github"]
  exclude_regex = ["_test\\.go"]
  delay = 300
  stop_on_error = true
  send_interrupt = true
  kill_delay = "2s"

[log]
  time = true

[misc]
  clean_on_exit = true
