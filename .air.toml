# Hot reload for the server during `make dev`. Vite serves the web UI and
# proxies /api and /events here, so only Go sources trigger a rebuild.
root = "."
tmp_dir = "var/air"

[build]
  cmd = "go build -o ./var/air/yt-studio ./cmd/server"
  # entrypoint takes the binary and its arguments as separate list entries.
  # The deprecated `bin` string is handed to /bin/sh as a single path, which
  # fails the moment the command has arguments.
  #
  # No flags: the database, the asset root and the address are what .env says,
  # or the binary's defaults, which are the same values these used to pass. A
  # flag here would beat the file and silently ignore it. air runs from the
  # repository root, so .env is where the server looks.
  entrypoint = ["./var/air/yt-studio", "serve"]
  include_ext = ["go", "sql"]
  exclude_dir = ["web", "var", ".git", ".github"]
  exclude_regex = ["_test\\.go"]
  delay = 300
  stop_on_error = true
  send_interrupt = true
  kill_delay = "2s"

[log]
  time = true

[misc]
  clean_on_exit = true
