version: '3'

vars:
  APP_NAME: "yt-studio"
  BIN_DIR: "bin"
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9246}}'
  # macOS only.
  GOOS: darwin

includes:
  common: ./build/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: darwin:build

  package:
    summary: Packages a production build of the application into an .app bundle
    cmds:
      - task: darwin:package

  run:
    summary: Runs the application
    cmds:
      - task: darwin:run

  dev:
    summary: Runs the application in development mode (hot reload)
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  test:
    summary: Runs the Go tests
    cmds:
      - go test -race ./internal/...

  generate:
    summary: Regenerates sqlc queries and TypeScript bindings
    cmds:
      - sqlc generate
      - wails3 generate bindings -clean=true -ts -i
