name: CI

# Standards are enforced, not intended (goal.md section 8). Every job here is a
# merge gate: lint, layering, race detection and the performance budgets.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint and layering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^adapters/sqlite/sqlcgen/' || true)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.1.6
          args: --timeout=10m

      # sqlc's SQLite dialect miscomputes query spans when a .sql file contains
      # multi-byte characters, silently truncating the generated statements.
      - name: SQL files are ASCII-only
        run: |
          ! grep -rlP '[^\x00-\x7F]' adapters/sqlite/queries adapters/sqlite/migrations \
            || { echo "non-ASCII in SQL corrupts sqlc output"; exit 1; }

      - name: sqlc output is up to date
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
          sqlc generate
          git diff --exit-code -- adapters/sqlite/sqlcgen || {
            echo "sqlc output is stale; run 'make generate' and commit the result"; exit 1;
          }

  test:
    name: Tests (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The race detector is not optional for a scheduler.
      - name: go test -race
        run: go test ./... -race -count=1 -timeout 900s

      - name: coverage
        run: |
          go test ./... -count=1 -coverprofile=coverage.out -covermode=atomic -timeout 600s
          go tool cover -func=coverage.out | tail -1

  bench:
    name: Performance budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      # The absolute budgets — dispatch under 1 ms and allocation-free, API p99
      # under 50 ms — are assertions inside the test suite, so they fail here.
      - name: absolute budgets
        run: go test ./domain/scheduler/ ./delivery/http/ -run 'Budget|AllocationFree|Latency|Fast' -count=1 -v

      - name: benchmark this branch
        run: go test ./... -run '^$' -bench . -benchmem -count 6 > bench-current.txt

      - name: benchmark the merge base
        if: github.event_name == 'pull_request'
        run: |
          git worktree add ../base ${{ github.event.pull_request.base.sha }}
          (cd ../base && go test ./... -run '^$' -bench . -benchmem -count 6 > "$GITHUB_WORKSPACE/bench-base.txt")

      # No benchmark may regress more than 5 % against the base.
      - name: benchstat gate
        if: github.event_name == 'pull_request'
        run: |
          benchstat bench-base.txt bench-current.txt | tee benchstat.txt
          python3 - <<'PY'
          import re, sys
          worst = 0.0
          offenders = []
          for line in open('benchstat.txt'):
              m = re.search(r'([+-]\d+\.\d+)%', line)
              if not m:
                  continue
              delta = float(m.group(1))
              if delta > worst:
                  worst = delta
              if delta > 5.0:
                  offenders.append(line.rstrip())
          if offenders:
              print('benchmarks regressed by more than 5%:')
              print('\n'.join(offenders))
              sys.exit(1)
          print(f'worst regression: {worst:.2f}%')
          PY

  web:
    name: Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm --prefix web ci --no-audit --no-fund

      # A drifted client type is a build failure, not a runtime surprise.
      - name: typecheck (includes the OpenAPI contract assertions)
        run: npm --prefix web run typecheck

      - run: npm --prefix web run build

      # The production bundle must stay under 250 KB gzipped.
      - name: bundle budget
        run: |
          total=$(find web/dist -name '*.js' -o -name '*.css' | xargs -I{} sh -c 'gzip -c "{}" | wc -c' | awk '{s+=$1} END {print s}')
          echo "gzipped bundle: $total bytes"
          if [ "$total" -gt 256000 ]; then
            echo "bundle exceeds the 250 KB gzipped budget"; exit 1
          fi

  build:
    name: Cross-compile
    runs-on: ubuntu-latest
    needs: [web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm --prefix web ci --no-audit --no-fund
      - run: npm --prefix web run build

      # cgo-free is what makes this work at all.
      - name: cross-compile
        run: |
          mkdir -p var/release
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=""
            [ "$os" = windows ] && ext=".exe"
            echo "building $os/$arch"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags="-s -w -X main.version=${GITHUB_SHA::8}" \
              -o "var/release/yt-studio-$os-$arch$ext" ./cmd/server
          done
          ls -lh var/release/

      - name: binary size
        run: |
          size=$(stat -c%s var/release/yt-studio-linux-amd64)
          echo "linux/amd64 binary: $((size / 1024 / 1024)) MB"
          # Flag growth well beyond the current ~15 MB, per section 8.3.
          if [ "$size" -gt 41943040 ]; then
            echo "the binary has grown past 40 MB; investigate before merging"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: var/release/
          retention-days: 7
